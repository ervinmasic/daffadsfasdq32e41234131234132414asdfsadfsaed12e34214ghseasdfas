name: TTNiche FYP Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes, 24/7
  workflow_dispatch:         # manual trigger for testing

jobs:
  fyp-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run FYP bot
        env:
          TTNICHE_URL:    ${{ secrets.TTNICHE_URL }}
          TTNICHE_SECRET: ${{ secrets.TTNICHE_SECRET }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          TIKWM_API_KEY:  ${{ secrets.TIKWM_API_KEY }}
        run: python bot.py
