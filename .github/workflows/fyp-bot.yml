name: TTNiche FYP Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes, 24/7
  workflow_dispatch:         # manual trigger for testing

jobs:
  fyp-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FYP bot
        env:
          TTNICHE_URL:    ${{ secrets.TTNICHE_URL }}
          TTNICHE_SECRET: ${{ secrets.TTNICHE_SECRET }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          TIKWM_API_KEY:  ${{ secrets.TIKWM_API_KEY }}
        run: python bot.py
